<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option C — swaylock-effects (realistic)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    /* Simulating blurred wallpaper */
    background:
      url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1920&q=80') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rubik', sans-serif;
    color: #d0dce0;
    overflow: hidden;
  }

  /* Blur + vignette overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: inherit;
    filter: blur(12px) brightness(0.7);
    transform: scale(1.05); /* prevent blur edge artifacts */
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
    z-index: 1;
  }

  .lockscreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
  }

  /* ---- Clock (above indicator) ---- */
  .time {
    font-size: 72px;
    font-weight: 300;
    letter-spacing: -3px;
    line-height: 1;
    color: #d0dce0;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    margin-bottom: 6px;
  }

  .date {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(208,220,224,0.7);
    text-shadow: 0 1px 10px rgba(0,0,0,0.5);
    margin-bottom: 40px;
  }

  /* ---- Indicator ring with frog avatar ---- */
  .indicator {
    width: 240px; height: 240px;
    border-radius: 50%;
    position: relative;
    margin-bottom: 24px;
  }

  /* Outer ring */
  .indicator-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 10px solid #2e4548;
    box-shadow: 0 4px 30px rgba(0,0,0,0.3);
  }

  /* Inner fill with frog */
  .indicator-inner {
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: #141c1fcc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
  }

  /* ---- Password dots (shown during typing) ---- */
  .password-dots {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #5aada8;
    box-shadow: 0 0 8px rgba(90,173,168,0.4);
  }

  .dot.empty {
    background: #2e4548;
    box-shadow: none;
  }

  /* ---- Username label ---- */
  .username {
    font-size: 14px;
    color: rgba(208,220,224,0.5);
    letter-spacing: 1px;
  }

  /* ---- Legend ---- */
  .legend {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    gap: 32px;
    font-size: 11px;
    color: rgba(208,220,224,0.3);
    letter-spacing: 1px;
  }

  .legend-color {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="lockscreen">
    <div class="time">21:37</div>
    <div class="date">Thu, 02 Apr</div>

    <div class="indicator">
      <div class="indicator-ring"></div>
      <div class="indicator-inner">&#x1F438;</div>
    </div>

    <div class="password-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot empty"></div>
      <div class="dot empty"></div>
      <div class="dot empty"></div>
    </div>

    <div class="username">matei@rewot-smibmuhb</div>
  </div>

  <div class="legend">
    <span><span class="legend-color" style="background:#2e4548"></span>Idle ring</span>
    <span><span class="legend-color" style="background:#5aada8"></span>Typing</span>
    <span><span class="legend-color" style="background:#408a70"></span>Verifying</span>
    <span><span class="legend-color" style="background:#c45858"></span>Wrong</span>
  </div>
</body>
</html>
