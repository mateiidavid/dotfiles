<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final — Alpine Dusk gtklock</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    background: url('../../../share/images/wallhaven-lmzrx2.png') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rubik', sans-serif;
    color: #d0dce0;
    overflow: hidden;
  }

  /* Blur + darken (simulates magick -blur 0x14 -brightness-contrast -40) */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: inherit;
    filter: blur(14px) brightness(0.5);
    transform: scale(1.06);
    z-index: 0;
  }

  .lockscreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
  }

  /* ---- Clock ---- */
  .time {
    font-size: 96px;
    font-weight: 300;
    letter-spacing: -4px;
    line-height: 1;
    color: #d0dce0;
    text-shadow: 0 2px 30px rgba(0,0,0,0.6);
    margin-bottom: 6px;
  }

  /* ---- Date + status (injected by lock.sh into --date-format) ---- */
  .date-line {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #5aada8;
    text-shadow: 0 1px 10px rgba(0,0,0,0.4);
    margin-bottom: 40px;
  }

  .date-line .status { color: #c9a84c; }

  /* ---- Keroro avatar ---- */
  .avatar {
    width: 120px; height: 120px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 10px;
    box-shadow:
      0 4px 30px rgba(0,0,0,0.5),
      0 0 0 3px rgba(90,173,168,0.3);
  }

  .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* ---- Username (from userinfo module) ---- */
  .username {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 1.5px;
    color: rgba(208,220,224,0.35);
    margin-bottom: 24px;
  }

  /* ---- Input box ---- */
  .input-wrapper {
    position: relative;
    width: 300px;
  }

  .input-box {
    width: 100%;
    height: 46px;
    border-radius: 12px;
    border: 1px solid #2e4548;
    background: rgba(20, 28, 31, 0.55);
    color: #d0dce0;
    font-family: 'Rubik', sans-serif;
    font-size: 14px;
    padding: 0 16px;
    outline: none;
    letter-spacing: 6px;
  }

  .input-box::placeholder {
    color: rgba(208,220,224,0.2);
    letter-spacing: 1px;
  }

  .input-box:focus {
    border-color: #5aada8;
    box-shadow: 0 0 20px rgba(90,173,168,0.12);
  }
</style>
</head>
<body>
  <div class="lockscreen">
    <div class="time">21:37</div>
    <div class="date-line">
      Thursday, 02 Apr &nbsp;&middot;&nbsp;
      <span class="status">MyWiFi &middot; 72% &middot; 14&deg;C Cloudy</span>
    </div>

    <div class="avatar">
      <img src="../../../share/images/keroro.jpg" alt="keroro">
    </div>

    <div class="username">matei</div>

    <div class="input-wrapper">
      <input class="input-box" type="password" placeholder="Password" autofocus>
    </div>
  </div>
</body>
</html>
